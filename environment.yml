  # Genome downloads
  - ncbi-genome-download>=0.3.3
  # Python scientific stack
  - biopython>=1.83
  - pandas>=2.0
  - numpy>=1.26
  - scipy>=1.12
  - matplotlib>=3.8
  - seaborn>=0.13
  - scikit-learn>=1.4
  - xgboost>=2.0
  - shap>=0.45
  - insilicoseq
  - pip
  - pip:
    - upsetplot
